name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 8 * * 1"

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out canonical app documentation
        uses: actions/checkout@v4
        with:
          repository: PrintBench/printbench
          ref: main
          path: .source/printbench
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run docs:check -- --source .source/printbench
      - name: Fetch all published app releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --paginate --slurp repos/PrintBench/printbench/releases > .source/releases.json
      - name: Check published release coverage
        run: npm run docs:check:releases -- --source .source/printbench --releases .source/releases.json
